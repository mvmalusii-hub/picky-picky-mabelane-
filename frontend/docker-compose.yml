version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: picky-postgres
    environment:
      POSTGRES_USER: picky_admin
      POSTGRES_PASSWORD: picky_password
      POSTGRES_DB: picky_picky_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U picky_admin -d picky_picky_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - picky-network

  redis:
    image: redis:7-alpine
    container_name: picky-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - picky-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: picky-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://picky_admin:picky_password@postgres:5432/picky_picky_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_jwt_secret_change_me
      JWT_EXPIRY: 7d
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_test_dummy
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: devsecret
      LIVEKIT_WS_URL: ws://livekit:7880
      FRONTEND_URL: http://localhost:3000
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_USER: dummy
      SMTP_PASS: dummy
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run dev
    networks:
      - picky-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: picky-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
      REACT_APP_WS_URL: ws://localhost:5000
      REACT_APP_STRIPE_PUBLISHABLE_KEY: pk_test_dummy
      REACT_APP_LIVEKIT_WS_URL: ws://localhost:7880
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm start
    networks:
      - picky-network

  livekit:
    image: livekit/livekit-server:latest
    container_name: picky-livekit
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882"
    environment:
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: devsecret
      LIVEKIT_RTC_PORT_RANGE_START: 50000
      LIVEKIT_RTC_PORT_RANGE_END: 50100
    command:
      - --node-ip=127.0.0.1
      - --bind=0.0.0.0
    networks:
      - picky-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: picky-mailhog
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - picky-network

  adminer:
    image: adminer:latest
    container_name: picky-adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - picky-network

volumes:
  postgres_data:
  redis_data:

networks:
  picky-network:
    driver: bridge
