name: Manual Deploy (Any Branch)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      backend_only:
        description: 'Deploy backend only?'
        required: false
        default: false
        type: boolean
      frontend_only:
        description: 'Deploy frontend only?'
        required: false
        default: false
        type: boolean

jobs:
  manual-backend:
    if: github.event.inputs.frontend_only != 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Backend to Render (${{ github.event.inputs.environment }})
        uses: johnbeynon/render-deploy-action@v1.2.2
        with:
          service-id: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}
          wait-for-success: true

  manual-frontend:
    if: github.event.inputs.backend_only != 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Frontend to Vercel (${{ github.event.inputs.environment }})
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          vercel-args: '${{ github.event.inputs.environment == 'production' && '--prod' || '--preview' }}'
